<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Piotruś</title>
<style>
  :root{
    --desk-1:#7ba2f0; --desk-2:#4a6fcc; --desk-3:#26418f;
    --felt:#008000;
    --felt-dark:#006400;
    --face:#fffefb;
    --card-w:71px;
    --card-h:96px;
    --bcard-w:54px;
    --bcard-h:73px;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top, 0px);
    padding-bottom:env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --desk-1:#3b5aa8; --desk-2:#253f86; --desk-3:#101e48; }
  }
  :root[data-theme="dark"]{ --desk-1:#3b5aa8; --desk-2:#253f86; --desk-3:#101e48; }
  html{scroll-padding-top:env(safe-area-inset-top, 0px);}
  *,*::before,*::after{box-sizing:border-box;}
  html,body{min-height:100%;}
  body{
    margin:0;
    background:var(--desk-2);
    background-image:radial-gradient(120% 80% at 50% 0%, var(--desk-1) 0%, var(--desk-2) 55%, var(--desk-3) 100%);
    background-attachment:fixed;
    font-family:Tahoma, "Segoe UI", Verdana, Geneva, sans-serif;
    font-size:11px;
    color:#000;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:18px 10px 40px;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- okno XP ---------- */
  .window{
    width:min(100%, 760px);
    border:1px solid #0831d9;
    border-radius:8px 8px 0 0;
    background:#ece9d8;
    box-shadow:0 10px 34px rgba(0,0,0,.45);
    overflow:hidden;
  }
  .titlebar{
    height:29px; display:flex; align-items:center; gap:5px;
    padding:0 4px 0 6px;
    background:linear-gradient(180deg,#0f68f0 0%, #3a93ff 8%, #0c60e8 40%, #0a58e0 88%, #2a7bf0 100%);
    border-bottom:1px solid #0831d9;
    color:#fff; text-shadow:1px 1px 1px rgba(0,0,0,.55);
    font-weight:bold; font-size:12px; user-select:none;
  }
  .titlebar .ico{
    width:16px;height:16px;border-radius:2px;
    background:linear-gradient(135deg,#fff 50%, #101010 50%);
    border:1px solid #222; flex:0 0 auto;
  }
  .titlebar .spacer{flex:1;}
  .tbtn{
    width:21px;height:21px;margin-left:1px;
    border:1px solid rgba(255,255,255,.65); border-radius:3px;
    background:linear-gradient(180deg,#5da5ff,#0a56d6);
    color:#fff;font-size:11px;font-weight:bold;
    display:flex;align-items:center;justify-content:center; cursor:default;
  }
  .tbtn.close{background:linear-gradient(180deg,#f58c78,#d64227 40%,#a32612);}

  .menubar{
    display:flex; flex-wrap:wrap; gap:2px; padding:3px 4px;
    background:linear-gradient(180deg,#f7f6f0,#ece9d8);
    border-bottom:1px solid #c2bfa8;
  }
  .menubar .sep{width:1px;background:#c2bfa8;margin:2px 3px;}
  .menubar button, .menubar label{
    font-family:inherit;font-size:11px; padding:3px 9px;
    background:transparent; border:1px solid transparent; border-radius:3px;
    cursor:pointer; color:#000;
  }
  .menubar button:hover, .menubar label:hover{
    background:linear-gradient(180deg,#fdfdfd,#dfe9fb); border:1px solid #7ba0e0;
  }
  .menubar button:active, .menubar label:active{background:#c6d8f5;}
  .menubar button:disabled{color:#a09c8c;cursor:default;background:transparent;border-color:transparent;}
  .menubar input[type=file]{display:none;}
  button:focus-visible, label:focus-visible, .tab:focus-visible, .card:focus-visible{outline:1px dotted #000;outline-offset:1px;}

  /* ---------- zakładki wariantów ---------- */
  .tabs{
    display:flex; flex-wrap:wrap; gap:0; padding:6px 6px 0;
    background:#ece9d8; border-bottom:1px solid #919b9c;
  }
  .tab{
    font-family:inherit;font-size:11px;
    padding:4px 12px 4px; margin-right:-1px; margin-bottom:-1px;
    border:1px solid #919b9c; border-bottom-color:#919b9c;
    border-radius:3px 3px 0 0;
    background:linear-gradient(180deg,#fff,#ecebe5 70%,#d8d6c9);
    cursor:pointer; color:#000; position:relative;
  }
  .tab:hover{border-top:2px solid #ffc83c;padding-top:3px;}
  .tab.on{
    background:#fcfcfe; border-bottom-color:#fcfcfe;
    border-top:2px solid #e68b2c; padding-top:3px; z-index:2; font-weight:bold;
  }
  .hintbar{
    padding:6px 8px; background:#fffbe6;
    border-bottom:1px solid #d9d2a8; font-size:11px; color:#403c20; line-height:1.45;
  }

  /* ---------- stół ---------- */
  .board{
    background:radial-gradient(110% 90% at 50% 0%, #0a9b0a 0%, var(--felt) 45%, var(--felt-dark) 100%);
    padding:10px 12px 12px;
    position:relative;
  }
  .bots{display:grid;gap:8px;grid-template-columns:repeat(var(--cols,1), minmax(0,1fr));margin-bottom:8px;}
  .seat{
    border:1px solid rgba(255,255,255,.18);
    border-radius:5px;
    background:rgba(0,0,0,.12);
    padding:5px 8px 6px;
    transition:border-color .2s, box-shadow .2s;
    min-width:0;
  }
  .seat.active{border-color:#ffe14d;box-shadow:0 0 0 1px #ffe14d inset, 0 0 12px rgba(255,225,77,.35);}
  .seat.target{border-color:#9fd8ff;border-style:dashed;}
  .seat.out{opacity:.6;}
  .seat .label{
    display:flex; align-items:center; gap:6px; flex-wrap:wrap;
    color:#fff; font-weight:bold; font-size:11px;
    text-shadow:1px 1px 1px rgba(0,0,0,.5); min-height:16px;
  }
  .seat .label .count{font-weight:normal;opacity:.85;}
  .badge{
    font-weight:normal; font-size:10px; text-shadow:none;
    padding:1px 6px; border-radius:8px; background:#fffbe6; color:#403c20;
    border:1px solid #d9d2a8;
  }
  .badge.turn{background:#ffe14d;border-color:#c7a400;color:#3a2f00;}
  .badge.pick{background:#dff1ff;border-color:#7ba0e0;color:#0b2a63;}
  .badge.safe{background:#d8f5d0;border-color:#69a85a;color:#1d4a12;}
  .badge.lose{background:#ffd9d2;border-color:#c0442c;color:#6b1404;}
  .avatar{width:34px;height:34px;border-radius:50%;flex:0 0 auto;border:2px solid #fff;
    box-shadow:0 1px 2px rgba(0,0,0,.45);background:var(--av,#ddd);object-fit:cover;display:block;}
  .seat.active .avatar{border-color:#ffe14d;}
  .end-row{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 auto 12px;}
  .end-row .show-card{margin:0;}
  .end-row .avatar{width:56px;height:56px;border-width:3px;}
  .langs{display:flex;gap:1px;margin-left:auto;align-items:center;}
  .langs span{padding:0 4px;color:#555;}
  .menubar .langs button{padding:3px 6px;}
  .menubar .langs button[aria-pressed="true"]{background:#c6d8f5;border:1px solid #7ba0e0;font-weight:bold;}

  .hand{position:relative;height:calc(var(--card-h) + 12px);margin-top:3px;}
  .bots .hand{height:calc(var(--bcard-h) + 10px);}
  .hand .empty{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    color:rgba(255,255,255,.65);font-size:11px;white-space:nowrap;
  }

  .middle{
    display:flex; align-items:center; gap:14px;
    min-height:calc(var(--card-h) + 26px);
    margin:2px 0 8px;
  }
  .discard{
    position:relative; flex:0 0 auto;
    width:calc(var(--card-w) * 2 + 20px); height:calc(var(--card-h) + 20px);
  }
  .discard .placeholder{
    position:absolute;left:10px;top:10px;
    width:var(--card-w);height:var(--card-h);
    border:1px solid rgba(255,255,255,.55);border-radius:5px;background:rgba(0,0,0,.10);
    display:flex;align-items:center;justify-content:center;text-align:center;
    color:rgba(255,255,255,.6);font-size:10px;padding:4px;
  }
  .discard .pc{position:absolute;}
  .discard .tally{
    position:absolute;right:0;bottom:-2px;
    background:#ece9d8;border:1px solid #7a7a6f;border-radius:8px;
    font-size:10px;padding:1px 6px;z-index:40;
  }
  .talk{flex:1;min-width:0;color:#fff;text-shadow:1px 1px 1px rgba(0,0,0,.5);}
  .talk .now{font-size:13px;font-weight:bold;margin-bottom:5px;line-height:1.3;}
  .talk ul{list-style:none;margin:0;padding:0;font-size:11px;line-height:1.5;opacity:.9;}
  .talk ul li:not(:first-child){opacity:.75;}

  /* ---------- karty ---------- */
  .card{
    position:absolute; left:0; top:8px;
    width:var(--card-w); height:var(--card-h);
    border-radius:5px; border:1px solid #6d6d6d;
    background:var(--face);
    box-shadow:0 1px 2px rgba(0,0,0,.35);
    user-select:none; overflow:hidden;
    transition:top .14s ease, box-shadow .14s ease;
  }
  .bots .card{width:var(--bcard-w);height:var(--bcard-h);top:6px;border-radius:4px;}
  .discard .card, .dialog .card{top:0;}
  .card.red{color:#d00000;}
  .card.black{color:#101010;}
  .card.joker{color:#6a1fb0;}
  .card .corner{position:absolute;font-weight:bold;font-size:13px;line-height:1;text-align:center;width:16px;}
  .card .corner.tl{top:4px;left:3px;}
  .card .corner.br{bottom:4px;right:3px;transform:rotate(180deg);}
  .card .corner small{display:block;font-size:13px;font-weight:normal;margin-top:1px;}
  .card.joker .corner{font-size:10px;width:12px;letter-spacing:-.5px;}
  .card .pip{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    font-size:34px;line-height:1;opacity:.95;
  }
  .card .face{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-52%);
    text-align:center;line-height:1;
  }
  .card .face b{display:block;font-size:24px;font-family:Georgia,"Times New Roman",serif;}
  .card .face span{display:block;font-size:18px;margin-top:1px;}
  .card.piotrus{background:linear-gradient(180deg,#fffefb 0%,#fff3d6 100%);}
  .card.piotrus .tag{
    position:absolute;left:0;right:0;bottom:15px;text-align:center;white-space:nowrap;
    font-size:9px;font-weight:bold;color:#7a0000;letter-spacing:.2px;
  }
  .card.back{
    background:#1b4ea8;
    background-image:
      repeating-linear-gradient(45deg, rgba(255,255,255,.18) 0 4px, transparent 4px 8px),
      repeating-linear-gradient(-45deg, rgba(255,255,255,.18) 0 4px, transparent 4px 8px),
      linear-gradient(180deg,#2d6fd0,#123a86);
    border-color:#0b2a63;
  }
  .card.back.custom{
    background-color:#333;
    background-image:var(--back-img);
    background-size:cover; background-position:center; background-repeat:no-repeat;
  }
  .card.back .inner{
    position:absolute;inset:3px;border:1px solid rgba(255,255,255,.75);border-radius:3px;pointer-events:none;
  }
  .card.back.custom .inner{border-color:rgba(255,255,255,.4);}

  .hand.pickable .card{cursor:pointer;}
  .hand.pickable .card:hover, .hand.pickable .card:focus-visible{top:0;box-shadow:0 4px 10px rgba(0,0,0,.45);}
  .hand.pickable{animation:none;}
  .card.lift{top:-2px !important;box-shadow:0 0 0 2px #ffe14d, 0 6px 12px rgba(0,0,0,.5);}
  .card.new{box-shadow:0 0 0 2px #9fd8ff, 0 0 10px rgba(159,216,255,.9);}
  .card.pairing{top:0 !important;box-shadow:0 0 0 2px #ffe14d, 0 0 14px rgba(255,225,77,.95);}
  .card.ghost{visibility:hidden;}
  .card.hint{animation:nope .25s linear 2;}
  @keyframes nope{0%,100%{margin-left:0;}25%{margin-left:-3px;}75%{margin-left:3px;}}
  .flyer{
    position:fixed !important; margin:0 !important; z-index:1000; pointer-events:none;
    transition:transform .42s cubic-bezier(.3,.7,.25,1);
    box-shadow:0 8px 18px rgba(0,0,0,.5);
  }

  /* ---------- pasek stanu ---------- */
  .statusbar{
    display:flex; flex-wrap:wrap; background:#ece9d8; border-top:1px solid #fff; padding:2px; font-size:11px;
  }
  .statusbar > div{
    border:1px solid #c2bfa8; border-top-color:#9a967f; border-left-color:#9a967f;
    padding:2px 8px; margin-right:2px; display:flex; align-items:center; gap:5px; min-height:20px;
  }
  .statusbar .grow{flex:1;min-width:120px;}
  .backprev{width:12px;height:16px;border-radius:2px;border:1px solid #0b2a63;display:inline-block;
    background:#1b4ea8 linear-gradient(180deg,#2d6fd0,#123a86);background-size:cover;background-position:center;}
  .backprev.custom{background-image:var(--back-img);border-color:#555;}

  /* ---------- okno dialogowe ---------- */
  .win{
    position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(0,0,0,.35);z-index:50;
  }
  .win.show{display:flex;}
  .win .dialog{
    width:min(290px, calc(100% - 20px));
    background:#ece9d8; border:1px solid #0831d9; border-radius:8px 8px 0 0; overflow:hidden;
    box-shadow:0 8px 24px rgba(0,0,0,.5); text-align:center;
  }
  .win .dialog .body{padding:14px 12px 16px;}
  .win .dialog .body p{margin:0 0 12px;font-size:12px;line-height:1.45;}
  .win .dialog .show-card{position:relative;width:var(--card-w);height:var(--card-h);margin:0 auto 12px;}
  .xpbtn{
    font-family:inherit;font-size:11px;padding:4px 16px;
    border:1px solid #003c74;border-radius:3px;
    background:linear-gradient(180deg,#fdfdfd,#e2e0d3);cursor:pointer;
  }
  .xpbtn:hover{box-shadow:inset 0 0 0 1px #f8b330;}

  .dropping .board::after{
    content:attr(data-drop);
    position:absolute;inset:6px;border:2px dashed #ffe14d;border-radius:6px;
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:14px;font-weight:bold;background:rgba(0,0,0,.35);z-index:60;
  }

  @media (max-width:560px){
    :root{--card-w:52px;--card-h:71px;--bcard-w:40px;--bcard-h:54px;}
    body{padding:8px 4px 24px;}
    .card .corner, .card .corner small{font-size:10px;}
    .card .corner{width:12px;}
    .card .corner.tl{top:3px;left:2px;}
    .card .corner.br{bottom:3px;right:2px;}
    .card .pip{font-size:24px;}
    .card .face b{font-size:18px;}
    .card .face span{font-size:13px;}
    .card.piotrus .tag{font-size:7px;bottom:11px;}
    .talk .now{font-size:12px;}
    .bots{grid-template-columns:1fr !important;}
  }
  @media (prefers-reduced-motion: reduce){
    .flyer{transition-duration:.01s;}
    .card{transition:none;}
  }
</style>
</head>
<body>
<div class="window" id="win-root">
  <div class="titlebar">
    <div class="ico"></div>
    <span id="wtitle">Piotruś</span>
    <div class="spacer"></div>
    <div class="tbtn">_</div>
    <div class="tbtn">▢</div>
    <div class="tbtn close">✕</div>
  </div>

  <div class="menubar">
    <button id="newGame"></button>
    <button id="shuffle"></button>
    <span class="sep"></span>
    <button id="botsBtn"></button>
    <button id="levelBtn"></button>
    <button id="speedBtn"></button>
    <span class="sep"></span>
    <label for="backFile" tabindex="0" id="backLbl"></label>
    <input type="file" id="backFile" accept="image/*">
    <button id="resetBack"></button>
    <div class="langs" id="langs" role="group"></div>
  </div>

  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="hintbar" id="hint"></div>

  <div class="board" id="board">
    <div class="bots" id="bots"></div>

    <div class="middle">
      <div class="discard" id="discard"></div>
      <div class="talk">
        <div class="now" id="now">&nbsp;</div>
        <ul id="log"></ul>
      </div>
    </div>

    <div class="seat" id="meSeat">
      <div class="label" id="meLabel"></div>
      <div class="hand" id="meHand"></div>
    </div>

    <div class="win" id="end">
      <div class="dialog">
        <div class="titlebar"><div class="ico"></div><span id="endTitle">Piotruś</span><div class="spacer"></div></div>
        <div class="body">
          <div class="end-row"><div class="show-card" id="endCard"></div><div id="endAv"></div></div>
          <p id="endText"></p>
          <button class="xpbtn" id="endNew"></button>
        </div>
      </div>
    </div>
  </div>

  <div class="statusbar">
    <div id="stVariant"></div>
    <div id="stPairs"></div>
    <div id="stScore"></div>
    <div class="grow" id="stInfo">&nbsp;</div>
    <div id="stBack"><span class="backprev" id="backPrev"></span><span id="stBackTxt"></span></div>
  </div>
</div>

      drop:'Suelta una imagen para usarla como reverso', pickAria:(i,n) => 'Robar la carta ' + i + ' de ' + n
    }
  };
  const LANGS = ['pl','en','de','es'];

  /* ---------- warianty (jeden adres, różne #hashe) ---------- */
  const VARIANTS = {
    klasyczny:{ranks:ALL, drop:'jacks', joker:false, color:false},
    kolory:   {ranks:ALL, drop:'clubs', joker:false, color:true},
    szybki:   {ranks:[9,10,11,12,13,1], drop:'jacks', joker:false, color:false},
    joker:    {ranks:ALL, drop:'', joker:true,  color:false}
  };
  const ORDER = ['klasyczny','kolory','szybki','joker'];
  const SPEEDS = [1.6, 1, .5];

  const $ = id => document.getElementById(id);
  const root = document.documentElement;

  function load(key, def){ try{ const v = localStorage.getItem(key); return v === null ? def : JSON.parse(v); }catch(e){ return def; } }
  function save(key, v){ try{ localStorage.setItem(key, JSON.stringify(v)); }catch(e){} }

  let settings = Object.assign({bots:1, level:'latwy', speed:1}, load('piotrus_settings', {}));
  let stats = load('piotrus_stats', {});
  let lang = load('piotrus_lang', null);
  if(!I18N[lang]){
    lang = 'pl';
  }
  let T = I18N[lang];

  /* ---------- stan gry ---------- */
  let variantKey, V, players, turn, discard, over, token = 0, logLines = [];
  let anim = false;
  let ui = {ghost:null, lift:null, fresh:null, pairing:[]};
  let memory = null;      // id Piotrusia w Twojej ręce zapamiętane przez sprytne boty
  let infoMsg = null;     // [klucz, parametr] dla paska stanu
  let nextId = 1;

  const rand = n => Math.floor(Math.random()*n);
  function shuffleArr(a){ for(let i=a.length-1;i>0;i--){ const j=rand(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }

  function pairKey(c){
    if(c.joker) return 'joker';
    return V.color ? c.r + (isRed(c.s) ? 'r' : 'b') : String(c.r);
  }
  function isPiotrus(c){ return V.joker ? !!c.joker : (c.r === 11 && c.s === 0); }
  function cardName(c){ return c.joker ? T.joker : T.ranks[c.r] + SUITS[c.s]; }
  const pname = i => players[i].name;

  function buildDeck(){
    const d = [];
    for(const r of V.ranks) for(let s=0;s<4;s++){
      if(r === 11 && ((V.drop === 'jacks' && s !== 0) || (V.drop === 'clubs' && s === 3))) continue;
      d.push({id:nextId++, r:r, s:s});
    }
    if(V.joker) d.push({id:nextId++, joker:true, r:0, s:-1});
    return shuffleArr(d);
  }

  function later(fn, ms){
    const t = token;
    setTimeout(() => { if(t === token) fn(); }, ms * SPEEDS[settings.speed]);
  }

  /* ---------- dziennik (zapisany jako klucze – tłumaczy się przy zmianie języka) ---------- */
  function addLog(key){
    const args = [].slice.call(arguments, 1);
    logLines.unshift({key:key, args:args});
    if(logLines.length > 4) logLines.length = 4;
  }
  // argumenty: {p:i} = imię gracza, {g:i} = imię w dopełniaczu, {c:card} = karta
  function logText(e){
    const a = e.args.map(x => {
      if(x && typeof x === 'object'){
        if('p' in x) return players[x.p] ? players[x.p].name : '';
        if('g' in x) return players[x.g] ? T.gen(players[x.g].name) : '';
        if('c' in x) return cardName(x.c);
      }
      return x;
    });
    return T.log[e.key].apply(null, a);
  }
  function setInfo(key, arg){ infoMsg = [key, arg]; paintInfo(); }
  function paintInfo(){
    if(!infoMsg){ $('stInfo').innerHTML = '&nbsp;'; return; }
    const v = T.st[infoMsg[0]] !== undefined ? T.st[infoMsg[0]] : T.menu.lvlT[infoMsg[1]];
    $('stInfo').textContent = typeof v === 'function' ? v(infoMsg[1]) : v;
  }

  function setVariant(key, push){
    if(!VARIANTS[key]) key = 'klasyczny';
    variantKey = key; V = VARIANTS[key];
    if(push && location.hash !== '#' + key){
      try{ history.replaceState(null, '', '#' + key); }catch(e){ location.hash = key; }
    }
    paintStatic();
    newGame();
  }

  function newGame(){
    token++;
    anim = false; over = false; memory = null;
    ui = {ghost:null, lift:null, fresh:null, pairing:[]};
    logLines = []; discard = [];
    players = [{name:T.you, bot:false, hand:[]}];
    for(let i=0;i<settings.bots;i++) players.push(Object.assign({bot:true, hand:[]}, BOTS[i]));
    const deck = buildDeck();
    let i = 0;
    while(deck.length){ players[i % players.length].hand.push(deck.pop()); i++; }
    players.forEach((p, k) => {
      const n = dropAllPairs(p);
      if(p.bot) addLog('dealBot', {p:k}, n); else addLog('dealYou', n);
    });
    players.forEach(p => { if(p.bot) shuffleArr(p.hand); });
    $('end').classList.remove('show');
    turn = 0;
    setInfo('newDeal');
    startTurn();
  }

  function dropAllPairs(p){
    let count = 0, changed = true;
    while(changed){
      changed = false;
      const seen = {};
      for(let i=0;i<p.hand.length;i++){
        const k = pairKey(p.hand[i]);
        if(k === 'joker') continue;
        if(seen[k] !== undefined){
          const a = p.hand[seen[k]], b = p.hand[i];
          p.hand = p.hand.filter(c => c !== a && c !== b);
          pushDiscard(a, b);
          count++; changed = true; break;
        }
        seen[k] = i;
      }
    }
    return count;
  }
  function pushDiscard(a, b){ discard.push({a:a, b:b, rot:(Math.random()*16-8), dx:rand(10), dy:rand(8)}); }

  function nextActive(i){
    for(let k=1;k<=players.length;k++){
      const j = (i + k) % players.length;
      if(players[j].hand.length) return j;
    }
    return -1;
  }
  const activeCount = () => players.filter(p => p.hand.length).length;

  /* ---------- przebieg tury ---------- */
  function startTurn(){
    if(over) return;
    if(activeCount() <= 1){ endGame(); return; }
    if(!players[turn].hand.length) turn = nextActive(turn);
    const giver = nextActive(turn);
    anim = false;
    render();
    if(players[turn].bot){
      anim = true;
      later(() => botMove(turn, giver), 650);
    }
  }

  function botMove(taker, giver){
    const h = players[giver].hand;
    let idx = rand(h.length);
    if(settings.level === 'sprytny' && giver === 0 && memory !== null && h.length > 1){
      const k = h.findIndex(c => c.id === memory);
      if(k >= 0 && Math.random() < 0.9){ do{ idx = rand(h.length); }while(idx === k); }
    }
    ui.lift = h[idx].id;
    render();
    later(() => doTake(taker, giver, idx), 420);
  }

  function humanPick(seat, idx, el){
    if(anim || over || turn !== 0 || !players[0].hand.length) return;
    const giver = nextActive(0);
    if(seat !== giver){ el.classList.add('hint'); setTimeout(() => el.classList.remove('hint'), 600); return; }
    anim = true;
    doTake(0, giver, idx);
  }

  function doTake(taker, giver, idx){
    const fromEl = document.querySelector('[data-id="' + players[giver].hand[idx].id + '"]');
    const fromRect = fromEl ? fromEl.getBoundingClientRect() : null;
    const card = players[giver].hand.splice(idx, 1)[0];
    players[taker].hand.push(card);
    if(giver === 0 && memory === card.id) memory = null;
    if(taker === 0 && isPiotrus(card)) memory = card.id;
    ui.lift = null; ui.ghost = card.id; ui.fresh = null;
    render();
    const toEl = document.querySelector('[data-id="' + card.id + '"]');
    fly(card, fromRect, toEl, giver === 0, taker === 0, () => {
      ui.ghost = null;
      if(taker === 0) ui.fresh = card.id;
      const p = isPiotrus(card);
      if(taker === 0) addLog('drawYou', {g:giver}, {c:card}, p);
      else if(giver === 0) addLog('takeYou', {p:taker}, {c:card}, p);
      else addLog('botBot', {p:taker}, {g:giver});
      render();
      afterTake(taker, giver, card);
    });
  }

  function afterTake(taker, giver, card){
    const hand = players[taker].hand;
    const k = pairKey(card);
    const mate = k === 'joker' ? null : hand.find(c => c !== card && pairKey(c) === k);
    if(mate){
      ui.pairing = [card.id, mate.id];
      render();
      later(() => {
        players[taker].hand = hand.filter(c => c !== card && c !== mate);
        pushDiscard(mate, card);
        ui.pairing = []; ui.fresh = null;
        if(taker === 0) addLog('pairYou', {c:mate}, {c:card});
        else addLog('pairBot', {p:taker}, {c:mate}, {c:card});
        finishTurn(taker, giver);
      }, 650);
    } else {
      later(() => finishTurn(taker, giver), 250);
    }
  }

  function finishTurn(taker, giver){
    [giver, taker].forEach(i => {
      const p = players[i];
      if(!p.hand.length && !p.doneLogged){
        p.doneLogged = true;
        if(i === 0) addLog('outYou'); else addLog('outBot', {p:i});
      }
    });
    if(players[taker].bot) shuffleArr(players[taker].hand);
    if(activeCount() <= 1){ render(); later(endGame, 350); return; }
    turn = nextActive(taker);
    startTurn();
  }

  function endGame(){
    if(over) return;
    over = true; anim = false;
    const loserIdx = players.findIndex(p => p.hand.length);
    const st = stats[variantKey] || (stats[variantKey] = {w:0, l:0});
    if(loserIdx === 0) st.l++; else st.w++;
    save('piotrus_stats', stats);
    if(loserIdx === 0) addLog('endLost'); else addLog('endWon', {p:loserIdx});
    setInfo(loserIdx === 0 ? 'lost' : 'won');
    render();
    paintEnd();
    $('end').classList.add('show');
  }

  function paintEnd(){
    if(!over) return;
    const loserIdx = players.findIndex(p => p.hand.length);
    const loser = players[loserIdx];
    $('endCard').innerHTML = '';
    if(loser){ const e = cardEl(loser.hand[0], true); e.style.left = '0'; $('endCard').appendChild(e); }
    $('endAv').innerHTML = '';
    if(loser && loser.bot) $('endAv').appendChild(avatarEl(loser));
    $('endText').innerHTML = loserIdx === 0 ? T.end.lost : T.end.won(loser.name);
  }

  /* ---------- animacja przelotu karty ---------- */
  function fly(card, fromRect, toEl, startFace, endFace, done){
    if(!fromRect || !toEl){ later(done, 200); return; }
    const to = toEl.getBoundingClientRect();
    const el = cardEl(card, startFace);
    el.classList.add('flyer');
    el.style.left = fromRect.left + 'px'; el.style.top = fromRect.top + 'px';
    el.style.width = fromRect.width + 'px'; el.style.height = fromRect.height + 'px';
    el.style.transformOrigin = '0 0';
    const dur = 420 * SPEEDS[settings.speed];
    el.style.transitionDuration = dur + 'ms';
    document.body.appendChild(el);
    const sx = to.width / fromRect.width, sy = to.height / fromRect.height;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      el.style.transform = 'translate(' + (to.left - fromRect.left) + 'px,' + (to.top - fromRect.top) + 'px) scale(' + sx + ',' + sy + ')';
    }));
    if(startFace !== endFace){
      setTimeout(() => {
        const swap = cardEl(card, endFace);
        el.className = swap.className + ' flyer';
        el.innerHTML = swap.innerHTML;
      }, dur / 2);
    }
    const t = token;
    setTimeout(() => { el.remove(); if(t === token) done(); }, dur + 40);
  }

  /* ---------- rysowanie ---------- */
  function avatarEl(p){
    const img = document.createElement('img');
    img.className = 'avatar';
    img.src = p.img; img.alt = p.name;
    img.style.setProperty('--av', p.bg);
    return img;
  }

  function cardEl(c, faceUp){
    const el = document.createElement('div');
    if(c && c.id) el.dataset.id = c.id;
    if(!faceUp){
      el.className = 'card back' + (customBack ? ' custom' : '');
      const inner = document.createElement('div');
      inner.className = 'inner';
      el.appendChild(inner);
      return el;
    }
    if(c.joker){
      el.className = 'card joker piotrus';
      el.innerHTML =
        '<div class="corner tl">' + T.jokerCorner + '<small>★</small></div>' +
        '<div class="face"><b>★</b><span>' + T.joker + '</span></div>' +
        '<div class="corner br">' + T.jokerCorner + '<small>★</small></div>' +
        '<div class="tag">' + T.tag + '</div>';
      return el;
    }
    el.className = 'card ' + (isRed(c.s) ? 'red' : 'black') + (isPiotrus(c) ? ' piotrus' : '');
    const suit = SUITS[c.s], rank = T.ranks[c.r];
    const mid = c.r >= 11
      ? '<div class="face"><b>' + rank + '</b><span>' + suit + '</span></div>'
      : '<div class="pip">' + suit + '</div>';
    el.innerHTML =
      '<div class="corner tl">' + rank + '<small>' + suit + '</small></div>' + mid +
      '<div class="corner br">' + rank + '<small>' + suit + '</small></div>' +
      (isPiotrus(c) ? '<div class="tag">' + T.tag + '</div>' : '');
    return el;
  }

  function px(name){ return parseFloat(getComputedStyle(root).getPropertyValue(name)) || 60; }

  function layoutFan(handEl, cards, faceUp, isBot, pickable, seat){
    handEl.innerHTML = '';
    handEl.classList.toggle('pickable', !!pickable);
    if(!cards.length){
      const e = document.createElement('div');
      e.className = 'empty';
      e.textContent = seat === 0 ? T.emptyMe : T.empty;
      handEl.appendChild(e);
      return;
    }
    const W = handEl.clientWidth || 300;
    const cw = isBot ? px('--bcard-w') : px('--card-w');
    const n = cards.length;
    const maxStep = isBot ? cw * 0.55 : cw * 0.82;
    const step = n > 1 ? Math.max(4, Math.min(maxStep, (W - cw) / (n - 1))) : 0;
    const off = Math.max(0, (W - (step * (n - 1) + cw)) / 2);
    cards.forEach((c, i) => {
      const e = cardEl(c, faceUp);
      e.style.left = (off + i * step) + 'px';
      e.style.zIndex = i + 1;
      if(ui.ghost === c.id) e.classList.add('ghost');
      if(ui.lift === c.id) e.classList.add('lift');
      if(ui.fresh === c.id && !isBot) e.classList.add('new');
      if(ui.pairing.includes(c.id)) e.classList.add('pairing');
      if(pickable){
        e.tabIndex = 0;
        e.setAttribute('role', 'button');
        e.setAttribute('aria-label', T.pickAria(i + 1, n));
        e.onclick = () => humanPick(seat, i, e);
        e.onkeydown = ev => { if(ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); humanPick(seat, i, e); } };
      }
      handEl.appendChild(e);
    });
  }

  function badge(cls, txt){ const b = document.createElement('span'); b.className = 'badge ' + cls; b.textContent = txt; return b; }

  function seatLabel(i, el){
    const p = players[i];
    const giverOfHuman = (!over && turn === 0 && players[0].hand.length) ? nextActive(0) : -1;
    el.innerHTML = '';
    if(p.bot) el.appendChild(avatarEl(p));
    const nm = document.createElement('span'); nm.textContent = p.bot ? p.name : T.you; el.appendChild(nm);
    const ct = document.createElement('span'); ct.className = 'count'; ct.textContent = T.cards(p.hand.length); el.appendChild(ct);
    if(over){
      el.appendChild(p.hand.length ? badge('lose', T.badge.lose) : badge('safe', T.badge.safe));
    } else if(!p.hand.length){
      el.appendChild(badge('safe', T.badge.out));
    } else {
      if(turn === i) el.appendChild(badge('turn', i === 0 ? T.badge.turn : T.badge.botTurn));
      if(i === giverOfHuman && !anim) el.appendChild(badge('pick', T.badge.pick));
      else if(players[turn].bot && nextActive(turn) === i) el.appendChild(badge('pick', T.badge.gives));
    }
  }

  function render(){
    const botsEl = $('bots');
    const nb = players.length - 1;
    botsEl.style.setProperty('--cols', nb);
    botsEl.innerHTML = '';
    const humanGiver = (!over && !anim && turn === 0 && players[0].hand.length) ? nextActive(0) : -1;
    for(let i=1;i<players.length;i++){
      const seat = document.createElement('div');
      seat.className = 'seat';
      if(!over && turn === i) seat.classList.add('active');
      if(i === humanGiver) seat.classList.add('target');
      if(!players[i].hand.length) seat.classList.add('out');
      const label = document.createElement('div'); label.className = 'label';
      const hand = document.createElement('div'); hand.className = 'hand';
      seat.appendChild(label); seat.appendChild(hand);
      botsEl.appendChild(seat);
      seatLabel(i, label);
      layoutFan(hand, players[i].hand, over, true, i === humanGiver, i);
    }

    const me = $('meSeat');
    me.classList.toggle('active', !over && turn === 0 && players[0].hand.length > 0);
    me.classList.toggle('out', !players[0].hand.length);
    seatLabel(0, $('meLabel'));
    layoutFan($('meHand'), players[0].hand, true, false, false, 0);

    // stos par
    const dEl = $('discard');
    dEl.innerHTML = '';
    if(!discard.length){
      const p = document.createElement('div'); p.className = 'placeholder'; p.textContent = T.pilePh;
      dEl.appendChild(p);
    } else {
      discard.slice(-5).forEach((d, i, arr) => {
        const g = document.createElement('div');
        g.className = 'pc';
        g.style.left = (4 + d.dx) + 'px'; g.style.top = (6 + d.dy) + 'px';
        g.style.transform = 'rotate(' + d.rot + 'deg)';
        g.style.zIndex = i * 2 + 1;
        const a = cardEl(d.a, true), b = cardEl(d.b, true);
        a.style.left = '0'; b.style.left = 'calc(var(--card-w) * .55)';
        g.appendChild(a); g.appendChild(b);
        if(i < arr.length - 1) g.style.filter = 'brightness(.93)';
        dEl.appendChild(g);
      });
      const t = document.createElement('div'); t.className = 'tally';
      t.textContent = T.pairsN(discard.length);
      dEl.appendChild(t);
    }

    // komunikat
    let now;
    if(over) now = T.now.over;
    else if(turn === 0) now = T.now.mine(T.gen(pname(nextActive(0))));
    else now = T.now.bot(pname(turn)) + (players[0].hand.length ? '' : T.now.watch);
    $('now').textContent = now;
    const log = $('log'); log.innerHTML = '';
    logLines.forEach(e => { const li = document.createElement('li'); li.textContent = logText(e); log.appendChild(li); });

    const st = stats[variantKey] || {w:0, l:0};
    $('stVariant').textContent = T.variants[variantKey][0];
    $('stPairs').textContent = T.st.pairs(discard.length);
    $('stScore').textContent = T.st.score(st.w, st.l);
    $('shuffle').disabled = anim || over || players[0].hand.length < 2;
  }

  /* ---------- teksty statyczne (menu, zakładki, język) ---------- */
  function paintStatic(){
    root.lang = lang;
    const vn = T.variants[variantKey];
    $('wtitle').textContent = T.game + ' – ' + vn[0];
    $('endTitle').textContent = T.game;
    document.title = T.game + ' – ' + vn[0];
    $('hint').textContent = vn[1];
    $('newGame').textContent = T.menu.newGame;
    $('shuffle').textContent = T.menu.shuffle; $('shuffle').title = T.menu.shuffleT;
    $('botsBtn').textContent = T.menu.opp(settings.bots); $('botsBtn').title = T.menu.oppT;
    $('levelBtn').textContent = T.menu.lvl[settings.level]; $('levelBtn').title = T.menu.lvlT[settings.level];
    $('speedBtn').textContent = T.menu.speed[settings.speed]; $('speedBtn').title = T.menu.speedT;
    $('backLbl').textContent = T.menu.upload;
    $('resetBack').textContent = T.menu.reset;
    $('endNew').textContent = T.end.again;
    $('stBackTxt').textContent = T.st.backLbl; $('stBack').title = T.st.backT;
    $('board').dataset.drop = T.drop;

    const tabs = $('tabs'); tabs.innerHTML = '';
    ORDER.forEach(k => {
      const b = document.createElement('button');
      b.className = 'tab' + (k === variantKey ? ' on' : '');
      b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', k === variantKey);
      b.textContent = T.variants[k][0];
      b.onclick = () => { if(k !== variantKey) setVariant(k, true); };
      tabs.appendChild(b);
    });

    const lg = $('langs'); lg.innerHTML = '';
    lg.setAttribute('aria-label', T.menu.lang);
    const lb = document.createElement('span'); lb.textContent = T.menu.lang + ':'; lg.appendChild(lb);
    LANGS.forEach(code => {
      const b = document.createElement('button');
      b.textContent = code.toUpperCase();
      b.title = I18N[code].label;
      b.setAttribute('lang', code);
      b.setAttribute('aria-pressed', code === lang);
      b.onclick = () => setLang(code);
      lg.appendChild(b);
    });
    paintInfo();
  }

  function setLang(code){
    if(!I18N[code] || code === lang) return;
    lang = code; T = I18N[code];
    save('piotrus_lang', lang);
    if(players) players[0].name = T.you;
    paintStatic();
    if(players){ render(); paintEnd(); }
  }

  /* ---------- rewers ---------- */
  let customBack = null;

  function applyBack(dataUrl){
    customBack = dataUrl;
    if(dataUrl) root.style.setProperty('--back-img', 'url("' + dataUrl + '")');
    else root.style.removeProperty('--back-img');
    $('backPrev').classList.toggle('custom', !!dataUrl);
    try{
      if(dataUrl) localStorage.setItem('piotrus_back', dataUrl);
      else localStorage.removeItem('piotrus_back');
    }catch(e){}
    render();
  }

  function loadBackFile(f){
    if(!f || !/^image\//.test(f.type)){ setInfo('notImg'); return; }
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const cw = 142, ch = 192; // 2x rozmiar karty
        const cv = document.createElement('canvas');
        cv.width = cw; cv.height = ch;
        const ctx = cv.getContext('2d');
        const scale = Math.max(cw / img.width, ch / img.height);
        const w = img.width * scale, h = img.height * scale;
        ctx.drawImage(img, (cw - w) / 2, (ch - h) / 2, w, h);
        applyBack(cv.toDataURL('image/jpeg', 0.85));
        setInfo('back', f.name);
      };
      img.onerror = () => setInfo('readFail', f.name);
      img.src = reader.result;
    };
    reader.readAsDataURL(f);
  }

  $('backFile').addEventListener('change', ev => {
    loadBackFile(ev.target.files && ev.target.files[0]);
    ev.target.value = '';
  });
  $('backLbl').addEventListener('keydown', ev => {
    if(ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); $('backFile').click(); }
  });
  $('resetBack').onclick = () => { applyBack(null); setInfo('backDef'); };

  const winRoot = $('win-root');
  let dragDepth = 0;
  const hasFiles = e => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
  winRoot.addEventListener('dragenter', e => { if(hasFiles(e)){ dragDepth++; winRoot.classList.add('dropping'); e.preventDefault(); } });
  winRoot.addEventListener('dragover', e => { if(hasFiles(e)) e.preventDefault(); });
  winRoot.addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if(!dragDepth) winRoot.classList.remove('dropping'); });
  winRoot.addEventListener('drop', e => {
    e.preventDefault(); dragDepth = 0; winRoot.classList.remove('dropping');
    loadBackFile(e.dataTransfer.files && e.dataTransfer.files[0]);
  });

  /* ---------- menu ---------- */
  $('newGame').onclick = () => newGame();
  $('endNew').onclick = () => newGame();
  $('shuffle').onclick = () => {
    if(anim || over) return;
    shuffleArr(players[0].hand);
    memory = null; ui.fresh = null;
    addLog('shuffled');
    setInfo('shuffled');
    render();
  };
  $('botsBtn').onclick = () => {
    settings.bots = settings.bots % 3 + 1;
    save('piotrus_settings', settings); paintStatic(); newGame();
  };
  $('levelBtn').onclick = () => {
    settings.level = settings.level === 'sprytny' ? 'latwy' : 'sprytny';
    save('piotrus_settings', settings); paintStatic();
    setInfo('lvl', settings.level);
  };
  $('speedBtn').onclick = () => {
    settings.speed = (settings.speed + 1) % SPEEDS.length;
    save('piotrus_settings', settings); paintStatic();
  };

  window.addEventListener('hashchange', () => {
    const k = location.hash.replace('#', '');
    if(VARIANTS[k] && k !== variantKey) setVariant(k, false);
  });
  let rz;
  window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if(players) render(); }, 80); });

  /* ---------- start ---------- */
  try{
    const saved = localStorage.getItem('piotrus_back');
    if(saved){ customBack = saved; root.style.setProperty('--back-img', 'url("' + saved + '")'); $('backPrev').classList.add('custom'); }
  }catch(e){}
  if(![1,2,3].includes(settings.bots)) settings.bots = 1;
  if(SPEEDS[settings.speed] === undefined) settings.speed = 1;
  if(!['latwy','sprytny'].includes(settings.level)) settings.level = 'latwy';
  setVariant(location.hash.replace('#', ''), true);
})();
</script>
</body>
</html>
