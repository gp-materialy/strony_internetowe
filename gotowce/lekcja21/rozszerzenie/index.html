<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collision System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-area">
    <div id="character">🧑‍🚀</div>
    <div id="enemy">👾</div>
    <div id="enemy2">👾</div>
    <div class="collectible" style="left: 100px; top: 150px;">⭐</div>
    <div class="collectible" style="left: 400px; top: 300px;">⭐</div>
    <div class="collectible" style="left: 600px; top: 100px;">⭐</div>
    <div class="collectible" style="left: 300px; top: 400px;">⭐</div>
    <div class="collectible" style="left: 700px; top: 250px;">⭐</div>
    <div id="game-over">
      <p>GAME OVER</p>
      <button id="restart-btn">Zagraj ponownie</button>
    </div>
    <div id="win-screen">
      <p>ZWYCIĘSTWO! 🏆</p>
      <button id="win-restart-btn">Zagraj ponownie</button>
    </div>
  </div>
  <div id="hud">
    <p>X: <span id="pos-x">0</span> Y: <span id="pos-y">0</span></p>
    <p>Wynik: <span id="score">0</span></p>
    <p><span id="lives">❤️❤️❤️</span></p>
    <p>Status: <span id="status">gra</span></p>
  </div>
  <script src="script.js"></script>
</body>
</html>
