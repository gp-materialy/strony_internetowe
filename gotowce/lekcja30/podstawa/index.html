<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme generator</title>
    <link rel="icon" href="dogicon.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <nav class="navbar bg-dark shadow mb-4" data-bs-theme="dark">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-3" href="#">
                <img src="doge.png" alt="Logo" width="48" height="48">
                <span class="app-title">Meme generator</span>
            </a>
        </div>
    </nav>

    <main class="container pb-4">
        <div class="row g-4">
            <div class="col-lg-4">
                <div class="card shadow">
                    <div class="card-header fw-bold">Ustawienia mema</div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="select-picture" class="form-label">Obrazek</label>
                            <input type="file" id="select-picture" class="form-control" accept="image/*">
                        </div>
                        <div class="mb-3">
                            <label for="text-top" class="form-label">Górny napis</label>
                            <input type="text" id="text-top" class="form-control" placeholder="Kiedy kod działa">
                        </div>
                        <div class="mb-3">
                            <label for="text-bottom" class="form-label">Dolny napis</label>
                            <input type="text" id="text-bottom" class="form-control" placeholder="za pierwszym razem">
                        </div>
                        <button type="button" id="download-button" class="btn btn-warning btn-lg w-100" disabled>
                            <i class="bi bi-download"></i> Pobierz mema
                        </button>
                    </div>
                </div>
            </div>
            <div class="col-lg-8">
                <div class="card shadow">
                    <div class="card-header fw-bold">Podgląd</div>
                    <div class="card-body">
                        <canvas id="meme" class="w-100 rounded"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
